<div class="search-container">
  <div class="search-box">
    <i class="fas fa-search search-icon" aria-hidden="true"></i>
    <input
      type="search"
      aria-label="Search candles by name"
      class="search-input"
      placeholder="Search candles by name..."
      [(ngModel)]="searchTerm"
      (input)="onSearchChange()"
    >
    @if (searchTerm) {
      <button class="clear-btn" aria-label="Clear search" (click)="clearSearch()" type="button">
        <i class="fas fa-times"></i>
      </button>
    }
  </div>
</div>
